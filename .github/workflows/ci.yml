name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # The examples are documentation, so a broken one is a broken doc.
      - name: Run the examples
        run: |
          for f in examples/*.kov; do
            echo "== $f"
            cargo run --quiet -- run "$f"
          done

      # Kove's own test runner, on Kove code.
      - name: Run the Kove test suite
        run: cargo run --quiet -- test examples/tests.kov

      # Kove code in the repository is formatted by Kove's own formatter.
      # tests/programs/invalid is excluded: those files do not parse by
      # design, and fmt refuses input the compiler would reject.
      - name: Check Kove formatting
        run: |
          cargo run --quiet -- fmt --check \
            examples tests/programs/valid tests/programs/runtime
