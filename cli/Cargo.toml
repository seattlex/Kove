[package]
name = "kove-cli"
description = "The `kove` command-line tool: build, run, check."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "kove_cli"
path = "src/lib.rs"

[[bin]]
name = "kove"
path = "src/main.rs"

[dependencies]
kove-parser = { workspace = true }
kove-ast = { workspace = true }
kove-resolver = { workspace = true }
kove-typechecker = { workspace = true }
kove-interpreter = { workspace = true }
kove-diagnostics = { workspace = true }
kove-formatter = { workspace = true }
kove-manifest = { workspace = true }
